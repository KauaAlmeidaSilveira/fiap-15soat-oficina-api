apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-api-config
  namespace: oficina
data:
  SPRING_PROFILES_ACTIVE: "default"
  # Substituir pelo endpoint real do RDS (terraform output rds_endpoint em fiap-15soat-oficina-infra-db).
  DB_HOST: "<RDS_ENDPOINT>"
  # Paths de leitura das chaves montadas via Secret (jwt-keys) em /app/keys — não são segredo em si,
  # apenas o caminho do arquivo; o conteúdo sensível vem do volume montado a partir do Secret.
  JWT_PUBLIC_KEY: "file:/app/keys/jwt.public.key"
  JWT_PRIVATE_KEY: "file:/app/keys/jwt.private.key"
  APP_PUBLIC_BASE_URL: "<APP_PUBLIC_BASE_URL>"
  # New Relic - nome da aplicacao no APM. A license key vem do Secret, nunca daqui.
  NEW_RELIC_APP_NAME: "oficina-api"
  # Os logs em JSON sao coletados do stdout pelo nri-bundle; desligar o forwarding
  # do agente evita ingerir a mesma linha duas vezes e dobrar o consumo da cota.
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "false"
