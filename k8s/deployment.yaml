apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app: oficina-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      containers:
        - name: oficina-api
          # Substituir pela URI real do ECR criada na fase de Terraform (/infra).
          image: "<ECR_URI>/oficina-api:latest"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secrets
                  key: DB_PASSWORD
            - name: GMAIL_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secrets
                  key: GMAIL_SMTP_USERNAME
            - name: GMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secrets
                  key: GMAIL_SMTP_PASSWORD
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: jwt-keys
          secret:
            secretName: oficina-api-secrets
            items:
              - key: jwt.private.key
                path: jwt.private.key
              - key: jwt.public.key
                path: jwt.public.key
