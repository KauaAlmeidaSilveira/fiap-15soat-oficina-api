spring.application.name=oficina-mecanica

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/oficina
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=oficina
spring.datasource.password=${DB_PASSWORD:oficina123}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console desabilitado
spring.h2.console.enabled=false

# Server
server.port=8080

# Actuator / metricas
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Springdoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT
jwt.public.key=${JWT_PUBLIC_KEY:classpath:jwt.public.key}
jwt.private.key=${JWT_PRIVATE_KEY:classpath:jwt.private.key}

app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.aprovacao-email.token-validade-dias=${APROVACAO_EMAIL_TOKEN_VALIDADE_DIAS:7}

# SMTP (Gmail) 
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_SMTP_USERNAME:}
spring.mail.password=${GMAIL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
