spring.profiles.active=dev
spring.application.name=oficina-mecanica

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/oficina
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=oficina
spring.datasource.password=${DB_PASSWORD:oficina123}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console desabilitado
spring.h2.console.enabled=false

# Server
server.port=8080

# Springdoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
